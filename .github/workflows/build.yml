name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Preparar proyecto
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then unzip -oq "$z" -d proyecto; fi
          done
          S=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          if [ -z "$S" ]; then echo "No se encontro settings.gradle.kts"; exit 1; fi
          echo "PROJ_DIR=$(dirname "$S")" >> $GITHUB_ENV
      - name: Compilar APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RadiosArgentinas-APK
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/app-debug.apk
